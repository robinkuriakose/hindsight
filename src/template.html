<title>Hindsight</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* Hindsight design system v8
   Type     Geist 13 / 15 / 17 / 20 / 28 / 44. Weights 400 500 600. Newsreader (upright) only for the clue headline,
            the round verdict and the scenario title: the game reports on you like a newspaper.
   Colour   Neutrals + brand indigo (actions, progress, mark). Gain/loss only on money and lines. Amber only for shorts.
   Shape    Three radii: 10 small controls, 14 buttons, 22 surfaces. Squircle corners where supported.
   Space    4pt grid. 20px phone margins, 24px between sections.
   Motion   Three curves. Standard 250ms (UI feedback), Emphasised 450ms (screen changes, digit rolls),
            Reveal 2.4s (ease in, long damped ease out) for the one moment per screen where money moves. */
:root {
  color-scheme: dark;
  --bg: #09090b; --s1: #141417; --s2: #1f1f24; --s3: #2c2c33; --hair: rgb(255 255 255 / 8%);
  --t1: #f6f6f8; --t2: #a3a3ad; --t3: #85858f;
  --brand: #8b74ff; --cta-bg: #6548ee; --on-cta: #fff;
  --gain: #3fd58f; --loss: #ff5d5d; --short: #ffb020;
  --paper: #e6e1d6; --ink: #16130f; --ink2: #5e574c; --seg-on: #3d3d45;
  --mat: rgb(9 9 11 / 74%);
  --r-s: 10px; --r-m: 14px; --r-l: 22px;
  --std: cubic-bezier(.2, 0, 0, 1); --emph: cubic-bezier(.3, 0, 0, 1);
  --maxw: 480px; --gut: 20px;
  --f: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif: 'Newsreader', 'Iowan Old Style', Georgia, serif;
  --cb1: #121216; --cb2: #08080a; --cgl: #7660ff; --cglo: .26; --cdot: #b3a5ff; --cdoto: .62; --ck0: #45454f; --cm0: #1f1f25; --ca0: .55; --ck1: #383841; --cm1: #1c1c22; --ca1: .5; --ck2: #2d2d35; --cm2: #18181d; --ca2: .6;
  --cfg: #f4f4f6; --cfg2: rgb(255 255 255 / 60%); --cfg3: rgb(255 255 255 / 55%); --cedge: inset 0 1px 0 rgb(255 255 255 / 10%), inset 0 0 0 1px rgb(255 255 255 / 7%); --csh: 0 24px 48px -26px rgb(70 50 200 / 55%); --csh2: 0 34px 60px -26px rgb(90 70 230 / 65%);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f6f8; --s1: #fff; --s2: #efeff3; --s3: #e2e2e8; --hair: rgb(0 0 0 / 8%);
  --t1: #0b0b0d; --t2: #52525c; --t3: #686872;
  --brand: #5a3fe6; --cta-bg: #5a3fe6; --seg-on: #fff;
  --gain: #067a47; --loss: #c4242b; --short: #915400;
  --paper: #fffdf7; --mat: rgb(246 246 248 / 78%);
  --cb1: #ffffff; --cb2: #ececf2; --cgl: #8b74ff; --cglo: .2; --cdot: #5a3fe6; --cdoto: .55; --ck0: #d6d6de; --cm0: #ececf2; --ca0: .9; --ck1: #dcdce3; --cm1: #efeff4; --ca1: .85; --ck2: #e2e2e8; --cm2: #f2f2f6; --ca2: .9;
  --cfg: #0b0b0d; --cfg2: rgb(11 11 13 / 58%); --cfg3: rgb(11 11 13 / 50%); --cedge: inset 0 1px 0 #fff, inset 0 0 0 1px rgb(0 0 0 / 7%); --csh: 0 24px 48px -28px rgb(70 50 200 / 30%); --csh2: 0 34px 60px -26px rgb(90 70 230 / 38%);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    color-scheme: light;
    --bg: #f6f6f8; --s1: #fff; --s2: #efeff3; --s3: #e2e2e8; --hair: rgb(0 0 0 / 8%);
    --t1: #0b0b0d; --t2: #52525c; --t3: #686872;
    --brand: #5a3fe6; --cta-bg: #5a3fe6; --seg-on: #fff;
    --gain: #067a47; --loss: #c4242b; --short: #915400;
    --paper: #fffdf7; --mat: rgb(246 246 248 / 78%);
    --cb1: #ffffff; --cb2: #ececf2; --cgl: #8b74ff; --cglo: .2; --cdot: #5a3fe6; --cdoto: .55; --ck0: #d6d6de; --cm0: #ececf2; --ca0: .9; --ck1: #dcdce3; --cm1: #efeff4; --ca1: .85; --ck2: #e2e2e8; --cm2: #f2f2f6; --ca2: .9;
  --cfg: #0b0b0d; --cfg2: rgb(11 11 13 / 58%); --cfg3: rgb(11 11 13 / 50%); --cedge: inset 0 1px 0 #fff, inset 0 0 0 1px rgb(0 0 0 / 7%); --csh: 0 24px 48px -28px rgb(70 50 200 / 30%); --csh2: 0 34px 60px -26px rgb(90 70 230 / 38%);
  }
}
* { box-sizing: border-box; }
html { background: var(--bg); touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--t1); font: 400 15px/22px var(--f); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: inherit; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, p, ul, ol, figure, blockquote { margin: 0; padding: 0; }
ul, ol { list-style: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.gain { color: var(--gain); } .loss { color: var(--loss); } .t2 { color: var(--t2); } .t3 { color: var(--t3); }
.x13 { font-size: 13px; line-height: 18px; } .x15 { font-size: 15px; line-height: 22px; } .x17 { font-size: 17px; line-height: 24px; }
.x20 { font-size: 20px; line-height: 26px; letter-spacing: -0.01em; }

/* the light: three layers in different places; changing mood crossfades them, so it reads as light moving, not a recolour */
.aura { position: fixed; left: -12%; right: -12%; top: -8%; height: 82vh; pointer-events: none; z-index: 0; will-change: transform; }
.aura i { position: absolute; inset: 0; opacity: 0; transition: opacity .9s var(--emph); }
.aura .a { background: radial-gradient(40% 46% at 20% 22%, rgb(118 96 255 / 40%), transparent 70%), radial-gradient(30% 36% at 78% 10%, rgb(166 120 255 / 22%), transparent 70%); animation: drift-a 24s ease-in-out infinite alternate; }
.aura .g { background: radial-gradient(42% 46% at 68% 16%, rgb(63 213 143 / 30%), transparent 70%), radial-gradient(30% 34% at 16% 6%, rgb(40 190 170 / 18%), transparent 70%); animation: drift-g 28s ease-in-out infinite alternate; }
.aura .l { background: radial-gradient(42% 46% at 34% 8%, rgb(255 93 93 / 28%), transparent 70%), radial-gradient(30% 34% at 88% 20%, rgb(255 140 110 / 14%), transparent 70%); animation: drift-l 26s ease-in-out infinite alternate; }
body[data-mood="brand"] .aura .a, body[data-mood="gain"] .aura .g, body[data-mood="loss"] .aura .l { opacity: 1; }
@keyframes drift-a { from { transform: translate(-3%, -2%) scale(1); } to { transform: translate(5%, 4%) scale(1.1); } }
@keyframes drift-g { from { transform: translate(4%, -1%) scale(1.06); } to { transform: translate(-4%, 3%) scale(1); } }
@keyframes drift-l { from { transform: translate(-2%, 2%) scale(1); } to { transform: translate(4%, -2%) scale(1.08); } }
:root[data-theme="light"] .aura i { filter: saturate(.9); } :root[data-theme="light"] .aura { opacity: .55; }
#app { position: relative; z-index: 1; }

/* layout */
.page { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gut) 148px; min-height: calc(100vh - 60px); }
.col > * + * { margin-top: 32px; }
.split > .col + .col { margin-top: 24px; }

/* top bar: full width, content aligned to the page column */
.top { position: sticky; top: 0; z-index: 20; height: 60px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 0 calc(max(var(--gut), (100% - var(--maxw)) / 2 + var(--gut)) - 10px) 0 max(var(--gut), (100% - var(--maxw)) / 2 + var(--gut));
  view-transition-name: top; isolation: isolate; }
.top::before { content: ""; position: absolute; inset: 0 0 -40px 0; z-index: -1; pointer-events: none;
  background: linear-gradient(to bottom, var(--bg) 0%, var(--bg) 54%, color-mix(in srgb, var(--bg) 70%, transparent) 72%, transparent 100%);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent); mask-image: linear-gradient(to bottom, #000 60%, transparent); }
.brandmark { display: inline-flex; align-items: center; gap: 8px; justify-self: start; font-weight: 600; font-size: 17px; letter-spacing: -0.02em; }
.brandmark svg { width: 22px; height: 22px; color: var(--brand); }
.top .tr { display: flex; justify-self: end; }
.ib { width: 44px; height: 44px; border-radius: var(--r-m); display: grid; place-items: center; color: var(--t1); justify-self: end; transition: background .25s var(--std), transform .25s var(--std); }
.ib:hover { background: var(--s2); } .ib:active { transform: scale(.94); }
.ib svg { width: 20px; height: 20px; }
.prog { display: flex; gap: 4px; }
.prog i { width: 24px; height: 4px; border-radius: 2px; background: var(--s3); }
.prog i.on { background: var(--brand); }

/* odometer (small discrete changes: stepper counts and year digits) */
.odo { display: inline-flex; }
.odo .d { display: inline-block; height: 1em; overflow: hidden; }
.odo .d > span { display: flex; flex-direction: column; transition: transform var(--dur, .45s) var(--emph); transition-delay: var(--dl, 0ms); }
.odo .d b { display: block; height: 1em; line-height: 1em; font-weight: inherit; text-align: center; }

/* money: baseline-aligned ₹, sized to always fit */
.num { display: flex; align-items: baseline; font-weight: 600; letter-spacing: -0.035em; line-height: 1.05; font-size: 44px; white-space: nowrap; }
.num .cur { font-size: 0.6em; font-weight: 500; color: var(--t2); letter-spacing: 0; margin-right: 0.08em; }
.hero { padding-top: 28px; }
.hero .num { margin-top: 8px; view-transition-name: hero-num; }
.kick { color: var(--t2); font-size: 13px; line-height: 18px; display: flex; align-items: center; gap: 6px; }
.sub { margin-top: 10px; color: var(--t2); text-wrap: pretty; }
.sub b { color: var(--t1); font-weight: 500; }
.chip { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 8px; font-size: 13px; font-weight: 500; background: var(--s2); margin-right: 8px; white-space: nowrap; vertical-align: 1px; }
.pair { white-space: nowrap; } .vsb { margin-right: 8px; }
.aft { display: block; margin-top: 6px; } .pre { margin-right: 8px; }
.chip.gain { background: color-mix(in srgb, var(--gain) 16%, transparent); } .chip.loss { background: color-mix(in srgb, var(--loss) 16%, transparent); }
.fade { transition: opacity .45s var(--emph), transform .45s var(--emph); }
.pending .fade { opacity: 0; transform: translateY(6px); }
.pending .after { display: none; }
.after { animation: rise .45s var(--emph) both; }
/* the next step appears with the results, not while the line is still drawing */
.pending .dock { opacity: 0; visibility: hidden; transform: translateY(16px); pointer-events: none; }
.dock { transition: opacity .45s var(--emph), transform .45s var(--emph), visibility .45s; }

/* year slots */
.yr { display: inline-flex; align-items: flex-end; font-weight: 600; letter-spacing: 0.02em; color: inherit; }
.yr .slot { position: relative; display: inline-block; width: 0.62em; height: 1em; margin: 0 0.04em; overflow: hidden; }
.yr .slot::after { content: ""; position: absolute; left: 1px; right: 1px; bottom: 0.08em; height: 1.5px; background: currentColor; opacity: 0.45; }
.yr .slot > span { position: absolute; inset: 0 auto auto 0; width: 100%; display: flex; flex-direction: column; opacity: 0; }
.yr .slot b { display: block; height: 1em; line-height: 1em; text-align: center; font-weight: inherit; }
.yr.spin .slot > span { opacity: 0.4; animation: spin .42s linear infinite; filter: blur(.4px); }
.yr.spin .slot::after { opacity: 0; }
@keyframes spin { to { transform: translateY(-10em); } }

/* the clue: the one paper object */
.clue { background: var(--paper); color: var(--ink); border-radius: var(--r-l); padding: 14px 18px 18px; box-shadow: 0 1px 0 rgb(0 0 0 / 4%), 0 16px 32px -22px rgb(0 0 0 / 50%); }
:root[data-theme="light"] .clue { box-shadow: 0 0 0 1px rgb(0 0 0 / 6%), 0 10px 28px -20px rgb(0 0 0 / 25%); }
.mast { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; border-bottom: 1px solid rgb(22 19 15 / 20%); padding-bottom: 8px; font-size: 11px; line-height: 16px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--ink2); }
.mast em { font-family: var(--serif); font-style: normal; font-size: 15px; letter-spacing: 0; text-transform: none; font-weight: 500; color: var(--ink); white-space: nowrap; }
.mast > span { white-space: nowrap; margin-left: auto; }
.mast .yr { font-size: 13px; color: var(--ink); letter-spacing: 0.06em; }
.hl { font-family: var(--serif); font-weight: 500; font-size: 20px; line-height: 26px; letter-spacing: -0.005em; margin-top: 10px; text-wrap: pretty; }

/* section labels: always outside the group */
.label { display: flex; justify-content: space-between; align-items: center; min-height: 36px; color: var(--t2); font-size: 13px; line-height: 18px; padding: 0; margin-bottom: 6px; }
.label.ctlrow { padding: 0; margin-bottom: 8px; }
.label button { min-height: 44px; display: inline-flex; align-items: center; gap: 4px; color: var(--t1); font-weight: 500; margin: -4px 0; }
.label button svg { width: 14px; height: 14px; color: var(--t2); }

/* groups + rows */
.group { background: var(--s1); border-radius: var(--r-l); overflow: hidden; }
:root[data-theme="light"] .group { box-shadow: 0 0 0 1px var(--hair); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 12px; height: 64px; padding: 0 16px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--hair); }
.nm { min-width: 0; display: flex; flex-direction: column; justify-content: center; height: 100%; transition: opacity .25s var(--std); }
.nm b { font-weight: 500; font-size: 15px; line-height: 20px; display: flex; align-items: center; gap: 2px; min-width: 0; }
.nm b .nt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nm b svg { width: 14px; height: 14px; flex: none; color: var(--t3); }
.nm span.ds { color: var(--t2); font-size: 13px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.nm:active { opacity: .55; }
.row.off .nm b { font-weight: 400; color: var(--t2); } .row.off .nm span.ds { color: var(--t3); }
.row.has-ret { grid-template-columns: minmax(0, 1fr) auto auto; }
.row > .ret { align-self: center; font-weight: 500; font-size: 15px; line-height: 20px; white-space: nowrap; }
.row.has-ret { height: auto; min-height: 64px; padding-top: 10px; padding-bottom: 10px; } .row.has-ret .nm span.ds { white-space: normal; }
.ds .ret2 { display: none; } .ds .ret2 em { font-style: normal; font-weight: 500; }
@media (max-width: 359px) { .top .brandmark > span { display: none; } }
@media (max-width: 389px) { .row > .ret { display: none; } .row.has-ret { grid-template-columns: minmax(0, 1fr) auto; } .ds .ret2 { display: inline; } .sb { width: 28px; height: 28px; } .sb::after { inset: -8px; } .ct { width: 26px; } .row { height: auto; min-height: 64px; padding: 10px 14px; column-gap: 8px; } .nm span.ds { white-space: normal; } }
.stp { display: flex; align-items: center; }
.sb { width: 32px; height: 32px; border-radius: 50%; background: var(--s2); display: grid; place-items: center; position: relative; color: var(--t1); transition: transform .25s var(--std), background .25s var(--std); }
.sb::after { content: ""; position: absolute; inset: -6px; }
.sb svg { width: 16px; height: 16px; }
.sb:hover:not(:disabled) { background: var(--s3); }
.sb:disabled { background: var(--s2); color: var(--t3); opacity: .38; }
.sb:active:not(:disabled) { transform: scale(.88); }
.ct { width: 32px; display: flex; justify-content: center; font-size: 17px; line-height: 1; font-weight: 600; color: var(--t3); --dur: .25s; }
.row.on .ct { color: var(--t1); } .row.sh .ct { color: var(--short); }
.pv { width: 48px; display: flex; flex-direction: column; align-items: center; line-height: 1; }
.pv .odo { font-size: 17px; font-weight: 600; color: var(--t3); --dur: .25s; }
.pv small { margin-top: 3px; font-size: 10px; line-height: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--t3); }
.pv.l .odo { color: var(--t1); } .pv.s .odo, .pv.s small { color: var(--short); }
.rv { text-align: right; display: flex; flex-direction: column; }
.rv b { font-weight: 600; font-size: 15px; line-height: 20px; } .rv span { font-size: 13px; line-height: 18px; }

/* long / short */
.mode { display: inline-flex; background: var(--s2); border-radius: var(--r-s); padding: 2px; }
.mode button { position: relative; height: 32px; padding: 0 14px; font-weight: 500; font-size: 13px; color: var(--t2); }
.mode button::after { content: ""; position: absolute; inset: -6px 0; }
.mode button span { position: relative; z-index: 1; }
.mode button::before { content: ""; position: absolute; inset: 0; border-radius: 8px; background: var(--seg-on); box-shadow: 0 1px 2px rgb(0 0 0 / 20%); opacity: 0; transform: scale(.94); transition: opacity .25s var(--std), transform .25s var(--std); }
.mode button[aria-pressed="true"] { color: var(--t1); }
.mode button[aria-pressed="true"]::before { opacity: 1; transform: none; }
.mode button.shm[aria-pressed="true"] { color: var(--short); }
.ctl { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.tb { min-height: 44px; padding: 0 4px; color: var(--t2); font-weight: 500; font-size: 13px; }
.tb:hover:not(:disabled) { color: var(--t1); } .tb:disabled { color: var(--t3); opacity: .6; }
.hint { color: var(--t2); font-size: 13px; line-height: 18px; margin: -2px 0 10px; }

/* dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--mat); -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%); border-top: 1px solid var(--hair); view-transition-name: dock; }
.dock-in { max-width: var(--maxw); margin: 0 auto; padding: 12px var(--gut) calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
.alloc { display: flex; align-items: center; gap: 12px; }
.segs { flex: 1; display: flex; gap: 3px; }
.segs i { flex: 1; height: 6px; border-radius: 3px; background: var(--s3); transform-origin: left center; }
.segs i.l { background: var(--t2); } .segs i.s { background: var(--short); }
.segs i.new { animation: grow .45s var(--emph); }
@keyframes grow { from { transform: scaleX(.2); opacity: .4; } }
.alloc span { font-size: 13px; line-height: 18px; color: var(--t2); min-width: 48px; text-align: right; }
.cta { width: 100%; height: 54px; border-radius: var(--r-m); background: var(--cta-bg); color: var(--on-cta); font-weight: 600; font-size: 17px; text-align: center; transition: transform .25s var(--std), background .25s var(--std), color .25s var(--std); }
.cta:active:not(:disabled) { transform: scale(.98); }
.cta:disabled { background: var(--s2); color: var(--t3); }
.cta2 { width: 100%; height: 44px; color: var(--t2); font-weight: 500; text-align: center; border-radius: var(--r-m); transition: color .25s var(--std); }
.cta2:hover { color: var(--t1); }

/* charts */
.chart { position: relative; }
.chart.bleed { margin: 0 calc(-1 * var(--gut)); }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart text { font: 500 12px var(--f); fill: var(--t3); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; line-height: 18px; color: var(--t2); margin-bottom: 12px; min-height: 18px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { width: 8px; height: 8px; border-radius: 50%; }
.legend b { color: var(--t1); font-weight: 600; }
.legend.later { opacity: 0; transition: opacity .45s var(--emph); }
.legend.later.in { opacity: 1; }
.land { transform-box: fill-box; transform-origin: center; animation: land .6s var(--emph) both; }
.halo { transform-box: fill-box; transform-origin: center; animation: halo 1.1s var(--emph) both; }
@keyframes land { from { transform: scale(0); } 60% { transform: scale(1.15); } to { transform: scale(1); } }
@keyframes halo { from { transform: scale(.6); opacity: .5; } to { transform: scale(3.2); opacity: 0; } }

/* line colour = where the line is right now against the bank */
.lc .you { stroke: var(--gain); transition: stroke .35s var(--std); } .lc .yd { stroke: var(--gain); transition: stroke .35s var(--std); }
.lc .end, .lc .gdot { fill: var(--gain); transition: fill .35s var(--std); } .lc .hl0 { stroke: var(--gain); }
.lc[data-side="loss"] .you, .lc[data-side="loss"] .yd, .lc[data-side="loss"] .hl0 { stroke: var(--loss); }
.lc[data-side="loss"] .end, .lc[data-side="loss"] .gdot { fill: var(--loss); }

/* verdict */
.verdict h2 { font-family: var(--serif); font-size: 28px; line-height: 32px; font-weight: 500; letter-spacing: -0.012em; text-wrap: balance; }
.verdict p { margin-top: 6px; color: var(--t2); }
.casc .row { animation: rise .45s var(--emph) both; animation-delay: calc(var(--i) * 40ms); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; }

/* ---------- theme ---------- */

/* ---------- model ---------- */

const TBL = new Map();
function table(s, a, b) {
  const key = s.id + '|' + a + '|' + b; let t = TBL.get(key); if (t) return t;

  s.options.forEach(o => {
    const p = o.prices, l = new Array(n + 1), sh = new Array(n + 1); l[0] = sh[0] = 1; let dead = false;
    for (let k = 1; k <= n; k++) { const m = p[a + k] / p[a]; l[k] = m; if (m >= 2) dead = true; sh[k] = dead ? 0 : 2 - m; }

      <section class="hero"><p class="kick">8 years later</p>${numHTML(you, 'heroNum')}
        <p class="sub fade">${(([a, b]) => vsBank(pill(tone(you / START_CASH), a), pill(tone(R.fdEnd / START_CASH), b)))(multPair(you / START_CASH, R.fdEnd / START_CASH))}<span class="aft">From ₹1,00,000</span></p></section>
      <section><div class="legend" id="legend"></div><div class="chart bleed" id="finalChart"></div></section>
      <section class="verdict fade"><h2>${verdictOf(you, R.fdEnd, '')[0]}</h2><p>${verdictOf(you, R.fdEnd, '')[1]}</p></section>
      <section class="fade"><div class="years" role="text" aria-label="${yearAt(s, 0)} to ${yearAt(s, RESULT_IDX)}"><span class="odo" aria-hidden="true">${odoInner(yearAt(s, 0), false)}</span><span class="arr" aria-hidden="true">→</span><span class="odo" aria-hidden="true">${odoInner(yearAt(s, RESULT_IDX), false)}</span></div>
        <p class="ttl">${esc(s.title)}</p><p class="story" id="story">${esc(first)}</p>${first.length < s.story.length ? '<button class="linkb" data-act="story">Read the story</button>' : ''}</section>
      ${histHTML(s, R, 'result')}</div>
    <div class="col"><section>${posterHTML(s, R)}</section>
      <div class="dock"><div class="dock-in"><button class="cta" data-act="hold">Hold till today</button><button class="cta2" data-act="new">Play again</button></div></div></div></div>
      <details class="more wide"><summary>Details ${I.down}</summary><div class="dgrid">
        <div class="dsec"><h3>Round by round</h3><ul class="group rnd">${rounds}</ul></div>
        <div class="dsec"><h3>The headlines</h3><ul class="heads">${s.headlines.map((x, i) => `<li>${esc(x.text)}<span>Round ${i + 1} · ${esc(x.when)}</span></li>`).join('')}</ul></div>
        <div class="dsec"><h3>Prices</h3>${priceTable(s, [...LEVEL_IDX, RESULT_IDX])}</div>${sourcesHTML()}</div></details>`;
}
function renderHold() {
  const s = sc(), R = summary(s, 'hold'), atRes = summary(s, 'result').you[RESULT_IDX], you = R.you[R.end], play = S.anim && !REDUCED;
  const T = table(s, 12, R.end), dead = S.rounds[3].alloc.map((a, i) => (a < 0 && T.S[i][T.n] === 0 ? i : -1)).filter(i => i >= 0);
  return `${topBar(5)}<div class="split${play ? ' pending' : ''}"><div class="col">
      <section class="hero"><p class="kick">Held to today · 11 Nov 2026</p>${numHTML(you, 'heroNum')}
        <p class="sub fade">${chip(you / atRes, fdGrowth(s, RESULT_IDX, R.end))}<span class="aft">Since the game ended · ${mult(you / START_CASH)} overall</span></p>
        ${dead.length ? `<p class="sub fade">${dead.map(i => `Your ${esc(sn(s.options[i]))} short didn’t survive.`).join(' ')}</p>` : ''}</section>
      <section><div class="legend" id="legend"></div><div class="chart bleed" id="holdChart"></div></section>
      <section class="verdict fade"><h2>${verdictOf(you, R.fdEnd, ' by today')[0]}</h2><p>${verdictOf(you, R.fdEnd, ' by today')[1]}</p></section></div>
    <div class="col">${histHTML(s, R, 'hold')}
      <div class="dock"><div class="dock-in"><button class="cta" data-act="new">Play again</button><button class="cta2" data-act="back-result">Back to result</button></div></div></div></div>
      <details class="more wide"><summary>Details ${I.down}</summary><div class="dgrid"><div class="dsec"><h3>Prices to today</h3>${priceTable(s, [...LEVEL_IDX, RESULT_IDX, endIdx(s)])}</div>${sourcesHTML()}</div></details>`;
}

/* ---------- render + wiring ---------- */
const app = $('app');
function render() {
  TIMERS.forEach(t => clearInterval(t)); TIMERS = []; EXP = null;
  if (SHEET != null) closeSheet(true);
  if (S.screen !== 'intro' && (!BY_ID[S.sid] || !S.alloc || S.alloc.length !== 6)) S = { screen: 'intro' };
  const html = ({ intro: renderIntro, level: renderLevel, round: renderRound, result: renderResult, hold: renderHold }[S.screen] || renderIntro)();
  const cut = html.indexOf('</header>') + 9;
  app.innerHTML = html.slice(0, cut) + '<main class="page">' + html.slice(cut) + '</main>';
  fitAll(app);
  initShare();
  document.body.dataset.mood = 'brand';
  drawCharts(!!S.anim);
  rollSoon(app);
  if (S.anim) { S.anim = false; save(); }
}
function drawCharts(animate) {
  const s = sc(), play = animate && !REDUCED;
  const yr = $('cardYear');
  if (yr && !REDUCED) { const years = ['2000', '2003', '2007', '2008', '2010', '2012', '2014', '2016', '2018', '2004']; let k = 0; TIMERS.push(setInterval(() => { k = (k + 1) % years.length; setOdo(yr, years[k]); }, 2400)); }
  const card = $('card');
  if (card && !REDUCED && window.matchMedia('(hover: hover)').matches) {
    card.onpointermove = e => { const r = card.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
      card.style.setProperty('--mx', fx * 100 + '%'); card.style.setProperty('--my', fy * 100 + '%'); card.style.setProperty('--px', (fx - 0.5) * -10 + 'px'); card.style.setProperty('--py', (fy - 0.5) * -8 + 'px'); };
  }
  if (!s) return;
  const mood = sd => { document.body.dataset.mood = sd; };
  const pending = () => { const sp = app.querySelector('.split.pending'); if (sp) sp.classList.remove('pending'); };
  const rc = $('roundChart');
  if (rc) {
    const rd = lastRound(), v = roundVals(s, rd), bank = [0, 1, 2, 3, 4].map(k => v[0] * fdGrowth(s, rd.d, rd.d + k)), hero = $('heroNum'), delta = $('delta'), base = delta.innerHTML;
    const col = `var(--${tone(v[4] / bank[4])})`;
    lineChart(rc, { you: v, bank, xl: STOPS, ticks: [0, 1, 2, 3, 4], dots: [0, 1, 2, 3], play, onSide: mood, legendEl: $('legend'), heroEl: hero,
      aria: `Your money at each six-month stop: ${v.map((x, i) => STOPS[i] + ' ' + inr(x)).join(', ')}. The bank: ${inr(bank[4])}.`,
      legend: i => i == null ? `<span><i style="background:${col}"></i>You <b style="color:${col}">${pct(v[4] / v[0])}</b></span><span><i style="background:var(--t3)"></i>Bank <b>${pct(bank[4] / bank[0])}</b></span>`
        : `<span><b>${i ? WHEN[i - 1] + ' in' : 'Start'}</b></span><span>You <b>${inr(v[i])}</b></span><span>Bank <b>${inr(bank[i])}</b></span>`,
      onScrub: i => { if (i == null) { setNum(hero, v[4]); delta.innerHTML = base; } else { setNum(hero, v[i]); delta.innerHTML = i ? `${chip(v[i] / v[0], fdGrowth(s, rd.d, rd.d + i))}<span class="aft">${WHEN[i - 1][0].toUpperCase() + WHEN[i - 1].slice(1)} in</span>` : 'Start'; } fit(hero); },
      onLand: pending });
    const ry = $('ryear'); if (ry && play) TIMERS.push(setTimeout(() => { if (ry.isConnected && ry.classList.contains('spin')) { ry.classList.remove('spin'); rollLate(ry); } }, 2000));
  }
  const fc = $('finalChart') || $('holdChart');
  if (fc) {
    const mode = fc.id === 'finalChart' ? 'result' : 'hold', R = summary(s, mode), labels = R.you.map((_, k) => label(s, k)), bank = R.you.map((_, k) => START_CASH * fdGrowth(s, 0, k)), hero = $('heroNum');
    const n = R.you.length, ticks = mode === 'hold' ? [0, 16, n - 1] : [0, 4, 8, 12, 16], xl = labels.map(l => l.slice(-4)), col = `var(--${tone(R.you[n - 1] / bank[n - 1])})`;
    const you = mode === 'hold' ? R.you : R.you;
    lineChart(fc, { you, bank, xl, ticks, log: true, dots: mode === 'hold' ? [0, 4, 8, 12, 16] : [0, 4, 8, 12], markIdx: mode === 'hold' ? RESULT_IDX : null, play, onSide: mood, legendEl: $('legend'), heroEl: hero, height: 210,
      aria: `You ${inr(R.you[n - 1])}, the bank ${inr(bank[n - 1])}`,
      legend: i => { const k = i == null ? n - 1 : i, [a, b] = moneyPair(R.you[k], bank[k]); return i == null ? `<span><i style="background:${col}"></i>You <b>${a}</b></span><span><i style="background:var(--t3)"></i>Bank, 6% a year <b>${b}</b></span>`
        : `<span><b>${esc(labels[i])}</b></span><span>You <b>${a}</b></span><span>Bank <b>${b}</b></span>`; },
      onScrub: i => { setNum(hero, i == null ? R.you[n - 1] : R.you[i]); fit(hero); }, onLand: pending });
  }
}
function openSheet(i) {
  const w = $('sheet'), body = $('sheetBody'); SHEET = i; LASTFOCUS = document.activeElement;
  body.innerHTML = sheetHTML(sc(), i); w.hidden = false; bindPrice(body);
  requestAnimationFrame(() => requestAnimationFrame(() => { w.classList.add('open'); const f = body.querySelector('[data-act="inc"]:not(:disabled), [data-act="close"]'); f && f.focus({ preventScroll: true }); }));
}
function closeSheet(instant) {
  const w = $('sheet'); w.classList.remove('open'); SHEET = null;
  if (instant || REDUCED) w.hidden = true; else setTimeout(() => { if (SHEET == null) w.hidden = true; }, 450);
  if (!instant && LASTFOCUS && document.contains(LASTFOCUS)) LASTFOCUS.focus({ preventScroll: true });
}
function refreshBet(prevAlloc, prevPlaced, focusSel, inSheet) {
  const s = sc(); $('bet').innerHTML = betHTML(s, prevAlloc); $('dock').innerHTML = dockHTML(prevPlaced);
  if (SHEET != null) $('sheetBody').innerHTML = sheetHTML(s, SHEET, prevAlloc[SHEET]);
  rollSoon(document.body); bindPrice(document.body);
  const scope = inSheet ? $('sheetBody') : app, f = focusSel && scope.querySelector(focusSel);
  if (f && !f.disabled) f.focus({ preventScroll: true });
}
function copyShare(b) {
  const txt = $('shareTxt').textContent, ok = () => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy text'; }, 1800); };
  const fallback = () => {
    try { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const done = document.execCommand('copy'); ta.remove(); if (done) return ok(); } catch (e) {}
    const pre = $('shareTxt'); pre.className = 'x13 t2'; pre.style.whiteSpace = 'pre-wrap'; pre.style.userSelect = 'all'; pre.style.marginTop = '12px'; b.textContent = 'Select the text below';
  };
  try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch (e) { fallback(); }
}
function swapTo(fn) { const run = () => { fn(); window.scrollTo({ top: 0, behavior: 'auto' }); }; if (document.startViewTransition && !REDUCED) { const vt = document.startViewTransition(run); [vt.ready, vt.finished, vt.updateCallbackDone].forEach(p => p && p.catch(() => {})); } else run(); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i, inSheet = !!b.closest('#sheet');
  if (act === 'theme') return setTheme({ dark: 'light', light: 'auto', auto: 'dark' }[THEME] || 'dark');
  if (act === 'new') return newGame();
  if (act === 'home') return swapTo(() => { S = { screen: 'intro' }; render(); });
  if (act === 'resume') { S = fetchStore('ht5-game', { screen: 'intro' }); S.anim = false; return go(); }
  if (act === 'lock') return lockIn();
  if (act === 'next') return next();
  if (act === 'hold') { S.screen = 'hold'; S.anim = true; return go(); }
  if (act === 'back-result') { S.screen = 'result'; S.anim = false; return go(); }
  if (act === 'copy') return copyShare(b);
  if (act === 'image') return shareImage(b);
  if (act === 'sqinfo') { const p = $('sqinfo'), open = p.hidden; p.hidden = !open; b.setAttribute('aria-expanded', String(open)); return; }
  if (act === 'story') { $('story').textContent = sc().story; b.remove(); return; }
  if (act === 'close') return closeSheet();
  if (S.screen !== 'level') return;
  if (act === 'open') { if (!isDesk()) return openSheet(i); EXP = EXP === i ? null : i; return refreshBet(S.alloc.slice(), placedOf(S.alloc), `[data-act="open"][data-i="${i}"]`); }
  const s = sc(), o = s.options[i], a = S.alloc[i], placed = placedOf(S.alloc), prevAlloc = S.alloc.slice();
  if (act === 'span') S.span = ((S.span || 0) + 1) % spansFor(S.level, LEVEL_IDX[S.level - 1]).length;
  else if (act === 'inc') { if (a < 0) S.alloc[i] = a + 1; else { if (a >= LONG_MAX || placed >= BUNDLES) return; S.alloc[i] = a + 1; } buzz(); }
  else if (act === 'dec') { if (a > 0) S.alloc[i] = a - 1; else { if (!shortable(o) || a <= -SHORT_MAX || placed >= BUNDLES) return; S.alloc[i] = a - 1; } buzz(); }
  else if (act === 'clear') S.alloc = S.alloc.map(() => 0);
  else if (act === 'keep') S.alloc = lastRound().alloc.slice();
  else return;
  save();
  refreshBet(prevAlloc, placed, b.dataset.i != null ? `[data-act="${act}"][data-i="${i}"]` : b.dataset.v ? `[data-act="${act}"][data-v="${b.dataset.v}"]` : `[data-act="${act}"]`, inSheet);
});
document.addEventListener('keydown', e => {
  if (SHEET == null) return;
  if (e.key === 'Escape') { e.preventDefault(); return closeSheet(); }
  if (e.key === 'Tab') { const f = [...$('sheetBody').querySelectorAll('button:not(:disabled), [tabindex="0"]')]; if (!f.length) return; const a = f[0], z = f[f.length - 1];
    if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); } }
});
$('sheet').addEventListener('click', e => { if (e.target.classList.contains('scrim')) closeSheet(); });
/* the light drifts on its own and moves gently with scroll */
let aT = 0; window.addEventListener('scroll', () => { if (aT || REDUCED) return; aT = requestAnimationFrame(() => { aT = 0; const a = $('aura'); if (a) a.style.transform = `translate3d(0, ${(-window.scrollY * 0.12).toFixed(1)}px, 0)`; }); }, { passive: true });
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { fitAll(app); drawCharts(false); }, 150); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitAll(app));
try { window.claude?.hot?.snapshot?.(() => S); } catch (e) {}
function start(data) { S = data && data.screen ? data : { screen: 'intro' }; S.anim = false; render(); }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
